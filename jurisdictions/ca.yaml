# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
# The federal acts were read at the Justice Laws Website, current to 2026-10-29, and the Directive
# on Service and Digital at tbs-sct.canada.ca. This file is informational and not legal advice.
code: CA
name: {en: Canada, fr: Canada}
rows:
  - id: APP-041
    text: {en: "No default time of receipt: each program may set by regulation when an electronic document counts as received. A record kept electronically keeps the date and time when it was sent or received.", fr: "Aucun moment de réception par défaut : chaque programme peut fixer par règlement quand un document électronique est reçu. Un document conservé sous forme électronique garde la date et l’heure de son envoi ou de sa réception."}
    status: looser
    source: {title: "Personal Information Protection and Electronic Documents Act, S.C. 2000, c. 5, sections 37 and 50", date: "2026-10-29", url: "https://laws-lois.justice.gc.ca/eng/acts/P-8.6/FullText.html", archive: "https://web.archive.org/web/20261109215403/https://laws-lois.justice.gc.ca/eng/acts/P-8.6/FullText.html"}
    last_checked: "2026-11-23"
  - id: APP-043
    text: {en: "No statute requires an acknowledgment. New and redesigned online services show the status of an application in real time, and each service publishes its service standards.", fr: "Aucune loi n’exige d’accusé de réception. Les services en ligne nouveaux ou remaniés montrent l’état d’une demande en temps réel, et chaque service publie ses normes de service."}
    status: looser
    source: {title: "Directive on Service and Digital, Treasury Board of Canada Secretariat, sections 4.6.2 and 4.6.5", date: "2025-08-29", url: "https://www.tbs-sct.canada.ca/pol/doc-eng.aspx?id=32601", archive: "https://web.archive.org/web/20261103002505/https://www.tbs-sct.canada.ca/pol/doc-eng.aspx?id=32601"}
    last_checked: "2026-11-23"
  - id: APP-054
    text: {en: "A time limit that falls on a holiday moves to the next day that is not a holiday. Sunday is a holiday and Saturday is not, and a time of day means standard time.", fr: "Un délai qui tombe un jour férié est reporté au jour suivant qui n’est pas férié. Le dimanche est férié et le samedi ne l’est pas, et une heure du jour s’entend de l’heure normale."}
    status: same
    source: {title: "Interpretation Act, R.S.C. 1985, c. I-21, sections 26, 29 and 35", date: "2026-10-29", url: "https://laws-lois.justice.gc.ca/eng/acts/I-21/FullText.html", archive: "https://web.archive.org/web/20261111153752/https://laws-lois.justice.gc.ca/eng/acts/i-21/FullText.html"}
    last_checked: "2026-11-23"
  - id: APP-025
    text: {en: "The public may communicate with and receive services from federal institutions in either official language, with an active offer, at the head office and where demand is significant.", fr: "Le public peut communiquer avec les institutions fédérales et en recevoir les services dans l’une ou l’autre langue officielle, avec une offre active, au siège et là où la demande est importante."}
    status: same
    source: {title: "Official Languages Act, R.S.C. 1985, c. 31 (4th Supp.), Part IV", date: "2026-10-29", url: "https://laws-lois.justice.gc.ca/eng/acts/O-3.01/FullText.html", archive: "https://web.archive.org/web/20261017152438/https://laws-lois.justice.gc.ca/eng/acts/o-3.01/FullText.html"}
    last_checked: "2026-11-23"
  - id: APP-024
    text: {en: "Personal information for an administrative purpose is collected from the person wherever possible, unless the person authorizes otherwise or a ground of disclosure applies. No statute gives a right to be asked only once.", fr: "Un renseignement personnel à des fins administratives est recueilli auprès de la personne autant que possible, sauf si elle autorise autre chose ou si un motif de communication s’applique. Aucune loi ne donne le droit de n’être interrogé qu’une fois."}
    status: stricter
    source: {title: "Privacy Act, R.S.C. 1985, c. P-21, section 5", date: "2026-10-29", url: "https://laws-lois.justice.gc.ca/eng/acts/P-21/FullText.html", archive: "https://web.archive.org/web/20261004121608/https://laws-lois.justice.gc.ca/eng/acts/P-21/FullText.html"}
    last_checked: "2026-11-23"
