languageRules:
  # French is the language of the Administration (articles 1 and 13.2). A business writes in French
  # only to obtain a permit, a similar authorization, a subsidy or other financial aid (article
  # 21.9). English is allowed for a person declared eligible for English instruction (article 22.2)
  # and where health, public safety or natural justice requires it (article 22.3). How far article
  # 21.9 reaches attachments is a question for counsel.
  - {code: french-default, language: fr, appliesTo: any, exclusive: false, sourceId: charter-french-language}
  - {code: charter-21-9, language: fr, appliesTo: business-permit-or-grant, exclusive: true, sourceId: charter-french-language}
  - {code: english-instruction-eligible, language: en, appliesTo: any, exclusive: false, sourceId: charter-french-language}
  - {code: natural-justice, language: en, appliesTo: any, exclusive: false, sourceId: charter-french-language}
prefillBases:
