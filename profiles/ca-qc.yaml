  - {code: joint-service-agreement, sourceId: access-act}
rules:
  - code: receipt-when-accessible
    summary: {en: "A technology-based document is presumed received when it becomes accessible at the active address that the recipient names.", fr: "Un document technologique est présumé reçu quand il devient accessible à l’adresse active que le destinataire indique."}
    sourceIds: [it-framework-act]
  - code: proof-of-time-to-the-second
    summary: {en: "Stored data that fix the date, hour, minute and second, with origin and destination, can prove the time of sending or receipt.", fr: "Des données conservées qui fixent la date, l’heure, la minute et la seconde, avec la provenance et la destination, peuvent prouver le moment de l’envoi ou de la réception."}
    sourceIds: [it-framework-act]
  - code: choice-of-medium
    summary: {en: "When a service exists on several media, the person chooses the medium.", fr: "Quand un service existe sur plusieurs supports, la personne choisit le support."}
    sourceIds: [it-framework-act]
  - code: chance-to-complete-file
    summary: {en: "The person has the chance to give the useful information and to complete the file.", fr: "La personne a l’occasion de fournir les renseignements utiles et de compléter son dossier."}
    sourceIds: [administrative-justice-act]
  - code: delay-unfavorable-benefit-decision
    summary: {en: "Before an unfavorable decision on an indemnity or a benefit, the body delays the decision for the time needed to let the person complete the file.", fr: "Avant une décision défavorable sur une indemnité ou une prestation, l’organisme retarde la décision le temps nécessaire pour que la personne complète son dossier."}
    sourceIds: [administrative-justice-act]
  - code: notice-before-unfavorable-permit-decision
    summary: {en: "Before an unfavorable decision on a permit, the body tells the person of its intention and reasons, and lets them complete the file.", fr: "Avant une décision défavorable sur un permis, l’organisme informe la personne de son intention et de ses motifs, et lui permet de compléter son dossier."}
    sourceIds: [administrative-justice-act]
  - code: collect-only-what-is-necessary
    summary: {en: "A body collects personal information only when it is necessary to its functions or to a program that it manages.", fr: "Un organisme ne recueille un renseignement personnel que s’il est nécessaire à ses fonctions ou à un programme dont il a la gestion."}
    sourceIds: [access-act]
  - code: notice-at-collection
    summary: {en: "At collection, the body says who collects, why, by what means, whether an answer is mandatory, the effect of a refusal and the rights of access and correction.", fr: "À la collecte, l’organisme indique qui recueille, à quelles fins, par quels moyens, si la réponse est obligatoire, l’effet d’un refus et les droits d’accès et de rectification."}
    sourceIds: [access-act]
  - code: privacy-by-default
    summary: {en: "A product with privacy settings offers the highest level of confidentiality by default.", fr: "Un produit qui a des paramètres de confidentialité offre par défaut le niveau de confidentialité le plus élevé."}
    sourceIds: [access-act]
  - code: destroy-when-purpose-done
    summary: {en: "When the purposes are achieved, the body destroys or anonymizes the personal information, subject to the archives law.", fr: "Quand les fins sont accomplies, l’organisme détruit ou anonymise le renseignement personnel, sous réserve de la loi sur les archives."}
    sourceIds: [access-act]
  - code: statement-of-services
    summary: {en: "A body that serves citizens publishes a statement of services with its objectives on the diligence of its services.", fr: "Un organisme qui sert les citoyens publie une déclaration de services avec ses objectifs sur la diligence de ses services."}
    sourceIds: [public-administration-act]
  - code: web-accessibility-standard
    summary: {en: "Websites meet SGQRI 008 3.0: WCAG 2.1 AA with some changes, and some criteria of WCAG 2.2 such as 3.3.7 and 3.3.8.", fr: "Les sites Web respectent le SGQRI 008 3.0 : les WCAG 2.1 AA avec quelques changements, et certains critères des WCAG 2.2 comme 3.3.7 et 3.3.8."}
    sourceIds: [sgqri-008]
