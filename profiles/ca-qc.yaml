# SPDX-License-Identifier: Community-Spec-1.0
# Jurisdiction profile of the FPSOT applications specification (APP-010 to APP-013), in the form
# of the class ApplicationProfile of model/applications.yaml. Released apart from the core rules
# (APP-011). Applications to Québec public bodies.
# The research read the French text of each Québec act at LégisQuébec, current to 2026-10-15. The
# archived copies below are older; they serve as copies, and the reading rests on the live text.
# Not legal advice.
# Article 52 of the Loi d'interprétation moves a time limit that ends on a jour férié to the next
# jour ouvrable, and names Saturday only for the land register. Whether a Saturday is a working
# day for other time limits is to be verified; this profile skips Saturdays, the reading that
# gives the applicant the later date, until counsel answers.
# Article 61(23) lists the holidays. Its point i is the day that the Governor General fixes by
# proclamation for the birthday of the Sovereign; the date below is that of Victoria Day, and the
# proclamation itself was not read, so that source is to be verified.
# The Loi sur la justice administrative binds the Administration gouvernementale of its article 3
# only; a municipality or a body of the health network declares whether it follows its rules.
